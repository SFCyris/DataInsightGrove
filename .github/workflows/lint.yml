name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff + mypy
        run: pip install "ruff>=0.6" "mypy>=1.10"

      - name: ruff check
        working-directory: backend
        run: ruff check .
        # ~520 pre-existing warnings inherited from rapid pre-1.0 dev.
        # Treated as warn-only until a dedicated cleanup pass; PR review
        # should still surface NEW warnings introduced by the change.
        continue-on-error: true

      - name: ruff format check
        working-directory: backend
        run: ruff format --check .
        continue-on-error: true  # Drop once the codebase is fully formatted.

      - name: mypy
        working-directory: backend
        # mypy on the engine + storage layers is the highest-value coverage;
        # API + steps remain unchecked until the type annotations land.
        run: mypy dig/engine dig/storage --ignore-missing-imports || true
        continue-on-error: true

  frontend:
    name: tsc + eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        # Workspace lockfile is at repo root.
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: frontend
        run: pnpm typecheck

      - name: Next.js lint
        working-directory: frontend
        # `next lint` reads .eslintrc / eslint.config — falls back to the
        # Next.js defaults when nothing is configured. Non-zero exit means
        # a real lint problem. Marked `continue-on-error: true` so a lint
        # finding produces a yellow warning on the PR rather than blocking
        # the merge while the lint config is still being tuned. (Round-2
        # finding: don't ALSO append `|| true` — that turns the failure
        # into a green check, defeating the warning surface entirely.)
        run: pnpm next lint
        continue-on-error: true
