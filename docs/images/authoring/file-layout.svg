<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, system-ui, sans-serif" font-size="13">
  <style>
    .root { font-weight: 600; fill: #0f172a; }
    .dir  { fill: #1e3a8a; font-weight: 600; }
    .file { fill: #334155; }
    .note { fill: #64748b; font-style: italic; font-size: 11px; }
    .tree { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
    .pill { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; rx: 4; ry: 4; }
    .pill text { fill: #1e3a8a; font-size: 10px; font-weight: 600; }
  </style>

  <text x="20" y="28" class="root">📁 DataInsightGrove/</text>

  <g class="tree" transform="translate(40, 50)">
    <text x="0"  y="0"   class="dir">├── backend/</text>
    <text x="20" y="20"  class="dir">├── steps/</text>
    <text x="40" y="40"  class="file">│   ├── filter_rows/         </text>     <text x="280" y="40" class="note">← built-in steps live here</text>
    <text x="40" y="60"  class="file">│   ├── pca/</text>
    <text x="40" y="80"  class="file">│   └── …</text>
    <text x="20" y="100" class="dir">└── connectors/</text>
    <text x="40" y="120" class="file">    ├── csv/                </text>      <text x="280" y="120" class="note">← built-in connectors live here</text>
    <text x="40" y="140" class="file">    ├── parquet/</text>
    <text x="40" y="160" class="file">    └── …</text>

    <text x="-20" y="190" class="dir">├── plugins/</text>
    <text x="0"   y="210" class="dir">├── steps/</text>
    <text x="20"  y="230" class="file">│   └── upper_string/       </text>     <text x="240" y="230" class="note">← YOUR step plugins go here</text>
    <text x="0"   y="250" class="dir">└── connectors/</text>
    <text x="20"  y="270" class="file">    └── my_connector/       </text>     <text x="240" y="270" class="note">← YOUR connector plugins go here</text>

    <text x="-20" y="300" class="dir">└── shared/schemas/</text>
    <text x="0"   y="320" class="file">    ├── step-manifest.schema.json     </text> <text x="280" y="320" class="note">← validates every manifest</text>
  </g>

  <g transform="translate(530, 80)">
    <rect class="pill" x="0" y="0" width="200" height="50" />
    <text x="100" y="20" text-anchor="middle" font-weight="600" fill="#1e3a8a">Auto-discovery</text>
    <text x="100" y="38" text-anchor="middle" fill="#1e3a8a" font-size="11">DIG scans both dirs at startup</text>
  </g>

  <g transform="translate(530, 200)">
    <rect class="pill" x="0" y="0" width="200" height="65" />
    <text x="100" y="20" text-anchor="middle" font-weight="600" fill="#1e3a8a">No registration</text>
    <text x="100" y="38" text-anchor="middle" fill="#1e3a8a" font-size="11">Drop a folder. Restart.</text>
    <text x="100" y="54" text-anchor="middle" fill="#1e3a8a" font-size="11">It shows up in /steps.</text>
  </g>
</svg>
