<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="-apple-system, system-ui, sans-serif" font-size="13">
  <style>
    .title { font-weight: 700; font-size: 16px; fill: #0f172a; }
    .h     { font-weight: 600; fill: #0f172a; font-size: 13px; }
    .code  { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; fill: #0f172a; }
    .lbl   { font-size: 11px; fill: #475569; }
    .arrow { stroke: #2563eb; stroke-width: 1.6; fill: none; marker-end: url(#a2); }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8; ry: 8; }
    .yellow { fill: #fef3c7; stroke: #d97706; }
    .blue   { fill: #dbeafe; stroke: #2563eb; }
    .green  { fill: #dcfce7; stroke: #16a34a; }
    .pink   { fill: #fce7f3; stroke: #db2777; }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <text x="20" y="28" class="title">A connector is also two files in a folder</text>

  <!-- Folder layout -->
  <rect class="panel" x="20" y="50" width="320" height="160" fill="#f8fafc" />
  <text x="34" y="74" class="h">📁 backend/connectors/csv/</text>

  <rect class="yellow" x="40" y="92" width="280" height="50" rx="4" ry="4" />
  <text x="54" y="112" class="code">📄 manifest.json</text>
  <text x="54" y="130" class="lbl">id, kind (source/sink/both), URI schemes, options</text>

  <rect class="blue" x="40" y="152" width="280" height="50" rx="4" ry="4" />
  <text x="54" y="172" class="code">🐍 connector.py</text>
  <text x="54" y="190" class="lbl">defines: read() and (optionally) write()</text>

  <!-- 2 roles -->
  <line class="arrow" x1="340" y1="120" x2="430" y2="120" />
  <line class="arrow" x1="340" y1="180" x2="430" y2="180" />

  <rect class="green" x="430" y="80" width="430" height="80" rx="6" ry="6" />
  <text x="444" y="102" class="h">📥 Source role — read()</text>
  <text x="444" y="122" class="code">def read(self, uri, options) → pl.LazyFrame:</text>
  <text x="444" y="140" class="code">    return pl.scan_csv(path, separator=options["delimiter"])</text>
  <text x="444" y="156" class="lbl">Lazy — Polars defers I/O until the executor materializes.</text>

  <rect class="pink" x="430" y="160" width="430" height="80" rx="6" ry="6" />
  <text x="444" y="182" class="h">📤 Sink role — write()</text>
  <text x="444" y="202" class="code">def write(self, frame, uri, options) → None:</text>
  <text x="444" y="220" class="code">    frame.write_csv(path, separator=options["delimiter"])</text>
  <text x="444" y="236" class="lbl">Called for OutputSpec entries with a `sink` block.</text>

  <!-- Where the connector kicks in -->
  <rect class="panel" x="20" y="240" width="840" height="125" fill="#f8fafc" />
  <text x="34" y="265" class="h">🌊 Where in the pipeline a connector runs</text>

  <text x="34" y="290" class="code">read()  →  pipeline.datasets[*]    (the entry points: each Dataset spec calls connector.read())</text>
  <text x="34" y="310" class="code">write() →  pipeline.outputs[*].sink (the exits: each Output with a sink calls connector.write())</text>
  <text x="34" y="335" class="lbl">Connectors don't appear in the DAG itself — they're the I/O boundary. Each pipeline can use many.</text>
</svg>
