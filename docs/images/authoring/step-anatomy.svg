<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system, system-ui, sans-serif" font-size="13">
  <style>
    .title { font-weight: 700; font-size: 16px; fill: #0f172a; }
    .h     { font-weight: 600; fill: #1e3a8a; font-size: 13px; }
    .file  { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; fill: #0f172a; }
    .arrow { stroke: #2563eb; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8; ry: 8; }
    .yellow { fill: #fef3c7; stroke: #d97706; }
    .blue   { fill: #dbeafe; stroke: #2563eb; }
    .green  { fill: #dcfce7; stroke: #16a34a; }
    .pink   { fill: #fce7f3; stroke: #db2777; }
    .grey   { fill: #f1f5f9; stroke: #64748b; }
    .lbl    { font-size: 11px; fill: #475569; }
    .code   { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; fill: #0f172a; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <text x="20" y="28" class="title">A step is two files in a folder</text>

  <!-- Folder pill -->
  <rect class="panel grey" x="20" y="50" width="320" height="170" />
  <text x="34" y="74" class="h">📁 backend/steps/upper_string/</text>

  <rect class="panel yellow" x="40" y="92" width="280" height="50" />
  <text x="54" y="112" class="file">📄 manifest.json</text>
  <text x="54" y="130" class="lbl">declares: id, params, UI hints, IO shape</text>

  <rect class="panel blue" x="40" y="152" width="280" height="50" />
  <text x="54" y="172" class="file">🐍 step.py</text>
  <text x="54" y="190" class="lbl">defines: how to run it (SQL or Python)</text>

  <!-- Arrows out of the folder -->
  <line class="arrow" x1="340" y1="117" x2="430" y2="117" />
  <line class="arrow" x1="340" y1="177" x2="430" y2="177" />

  <!-- Manifest target: UI form -->
  <rect class="panel yellow" x="430" y="80" width="430" height="80" />
  <text x="444" y="102" class="h">UI form (auto-generated from manifest)</text>
  <text x="444" y="122" class="code">column ▾  [pick a string column]</text>
  <text x="444" y="140" class="code">required:✓  type: column_ref  filter: ['string']</text>
  <text x="444" y="156" class="lbl">Frontend reads /steps and renders the right inputs.</text>

  <!-- Step.py target: executor -->
  <rect class="panel blue" x="430" y="160" width="430" height="80" />
  <text x="444" y="182" class="h">Executor (runs the step)</text>
  <text x="444" y="202" class="code">step.to_sql({"column":"name"}, {"in":'"upstream"'})</text>
  <text x="444" y="220" class="code">→ 'SELECT * REPLACE (UPPER("name") AS "name") FROM "upstream"'</text>
  <text x="444" y="236" class="lbl">DIG wraps every step's SQL into one big DuckDB query.</text>

  <!-- Loaded into registry -->
  <rect class="panel green" x="20" y="250" width="840" height="80" />
  <text x="34" y="274" class="h">🎯 At backend startup: StepRegistry scans both folders</text>
  <text x="34" y="295" class="code">for folder in {backend/steps, plugins/steps}.iterdir():</text>
  <text x="34" y="313" class="code">    validate(folder/manifest.json) → import folder/step.py → register `step` instance</text>

  <!-- Available everywhere -->
  <rect class="panel pink" x="20" y="345" width="840" height="95" />
  <text x="34" y="370" class="h">⚡ Now available everywhere</text>
  <text x="34" y="390" class="code">GET  /steps                     ← lists every step (incl. yours)</text>
  <text x="34" y="408" class="code">GET  /steps/upper_string        ← returns the manifest</text>
  <text x="34" y="426" class="code">POST /pipelines/.../runs        ← uses your step inside the executor</text>
</svg>
